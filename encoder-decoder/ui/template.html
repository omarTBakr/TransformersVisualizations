  .pnl h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }

  /* Paper tile */

  .eq { font-family: "Cambria Math", "STIX Two Math", "Latin Modern Math", Georgia, serif; font-size: 14px; line-height: 1.9;
        background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; overflow-x: auto; }

  .pgtag { float: right; margin-left: 6px; font-size: 11px; color: var(--accent); font-weight: 600; white-space: nowrap; }
  .sec.pg { cursor: pointer; font: inherit; font-size: 12px; color: var(--accent); }
  .pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 6px; font-size: 12.5px; }
  .pv-bar .pv-title { margin-right: auto; color: var(--muted); }
  .pv-bar .pbtn { padding: 2px 8px; font-size: 12px; min-width: 0; }
  .pv { height: 380px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; background: #fff; margin-bottom: 10px; position: relative; }
  .pv.big { height: calc(100vh - 110px); margin: 0; }

  /* minimal pdf.js text layer (selectable text over the canvas) */
  .textLayer { position: absolute; inset: 0; overflow: hidden; line-height: 1; z-index: 2; text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0; }
  .textLayer span, .textLayer br { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
  .textLayer span.markedContent { top: 0; height: 0; }
  .textLayer ::selection { background: rgba(47, 111, 222, 0.3); }
  /* implementation notes */
  .row .im, .row .im0 { flex: none; width: 18px; }

  .row.impl { box-shadow: inset 3px 0 0 var(--impl); }
  .row.implact { background: var(--impl-bg); }
  .callout { position: sticky; left: 62px; margin: 2px 16px 6px 62px; padding: 6px 10px; border: 1px solid var(--impl); border-radius: 8px; background: var(--impl-bg);
             font-family: system-ui, Cantarell, "Noto Sans", Arial, sans-serif; white-space: normal; font-size: 12.5px; max-width: 760px; }
  .callout.act { box-shadow: 0 0 0 2px var(--impl); }

              border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; font-size: 12.5px; }

  .cm { display: block; margin-top: 6px; color: var(--text); }

  .cm .why { display: block; color: var(--muted); font-size: 12px; }

  .cm .dmap th { color: var(--muted); font-weight: 600; }

  .hlr.foc { background: rgba(250, 204, 21, 0.55); }
  .hlr.oth { background: rgba(250, 204, 21, 0.16); }
  .hlr.act { background: rgba(47, 111, 222, 0.30); box-shadow: 0 0 0 1.5px #2f6fde; }
  .pv-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .pv-modal[hidden] { display: none; }

  .legal { font-size: 11.5px; color: var(--muted); margin-top: 8px; border-top: 1px solid var(--border); padding-top: 6px; }
  .legal summary { cursor: pointer; color: var(--text); font-weight: 600; }

  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }

  /* Player */
  .player { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }

  .topbar { flex: none; position: relative; z-index: 8; background: var(--surface); border-bottom: 1px solid var(--border);
            padding: 8px 20px 6px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06); }

  @media (max-width: 700px) { .topbar { padding: 6px 12px; } .topbar .player { flex-wrap: wrap; } .topbar .scrub { flex-basis: 100%; margin: 4px 0; } }
  .counter b { color: var(--text); }

  select.speed { font: inherit; font-size: 12.5px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; }

  /* Diagram */
  svg.diagram { width: 100%; height: auto; display: block; font-family: system-ui, Cantarell, "Noto Sans", "DejaVu Sans", Arial, sans-serif; }
  .blk { cursor: pointer; }
  .blk rect { stroke: var(--block-stroke); stroke-width: 1; transition: stroke-width .15s, opacity .2s; }
  .blk text { fill: var(--text); pointer-events: none; }
  .blk .file { fill: var(--muted); font-size: 9.5px; }
  .blk:hover rect { stroke: var(--accent); stroke-width: 2; }
  .blk:focus { outline: none; }
  .blk:focus-visible rect { stroke: var(--accent); stroke-width: 2.5; }
  .blk.selected rect { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 4 3; }
  .blk.hl rect { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 5 3; }
  .blk.active rect { stroke: var(--accent); stroke-width: 3.5; filter: drop-shadow(0 0 5px var(--accent)); }
  .k-embed rect { fill: var(--embed); } .k-pe rect { fill: var(--pe); } .k-attn rect { fill: var(--attn); }
  .k-ffn rect { fill: var(--ffn); } .k-norm rect { fill: var(--norm); } .k-linear rect { fill: var(--linear); }
  .k-softmax rect { fill: var(--softmax); } .k-stack rect { fill: var(--surface-2); } .k-misc rect { fill: var(--surface-2); }
  .bracket { fill: var(--stack); stroke: var(--block-stroke); stroke-width: 1.2; transition: stroke .2s; }
  .bracket.running { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; }
  .bracket.selected { stroke: var(--accent); stroke-width: 2.5; }
  .badge-t { fill: var(--accent); font-size: 11px; font-weight: 700; }
  .arrow { fill: none; stroke: var(--arrow); stroke-width: 1.4; transition: stroke .15s; }
  .arrow.in { stroke: var(--accent); stroke-width: 2.8; stroke-dasharray: 7 4; animation: flow .6s linear infinite; }
  .arrow.out { stroke: var(--accent-2); stroke-width: 2.4; stroke-dasharray: 3 3; }
  @keyframes flow { to { stroke-dashoffset: -11; } }
  .lbl { fill: var(--muted); font-size: 12px; }
  .lbl-strong { fill: var(--text); font-size: 12.5px; font-weight: 600; }
  .plus circle { fill: var(--surface); stroke: var(--block-stroke); }
  .plus text { fill: var(--text); font-size: 15px; }
  .plus.active circle { stroke: var(--accent); stroke-width: 3; }
  #shapeTag rect { fill: var(--accent); }
  #shapeTag text { fill: #fff; font-size: 10.5px; font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 22px; height: 0; border-top: 3px dashed var(--accent); vertical-align: middle; margin-right: 5px; }
  .legend i.o { border-top-color: var(--accent-2); border-top-style: dotted; }

  .extra { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .extra button, .files button { font-size: 12.5px; cursor: pointer; text-align: left; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; }
  .extra button:hover, .files button:hover, .extra button.selected, .files button.selected { border-color: var(--accent); background: var(--accent-soft); }
  .extra button.active { border-color: var(--accent); border-width: 2px; background: var(--accent-soft); font-weight: 600; }
  details.toggle > summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 8px; }
  details.toggle > summary::-webkit-details-marker { display: none; }
  details.toggle > summary::before { content: "▸"; color: var(--muted); font-size: 12px; transition: transform .15s; }
  details.toggle[open] > summary::before { transform: rotate(90deg); }
  details.toggle > summary h2 { margin: 0; }
  details.toggle > summary .hint { font-size: 12px; color: var(--muted); }
  details.toggle[open] > summary { margin-bottom: 8px; }
  .files { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
  .files button { width: 100%; display: flex; justify-content: space-between; gap: 8px; }
  .files .fname { font-weight: 600; }
  .files .fblocks { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Step card */

  .dims tr.outrow td { font-weight: 600; }
  .dims .shape { color: var(--accent); font-weight: 600; }
  .sub { font-size: 12px; color: var(--muted); margin: 8px 0 4px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .preview { font-size: 12px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; overflow-x: auto; white-space: nowrap; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: var(--surface-2); padding: 2px 10px; font-size: 12px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }
  .heat { display: grid; gap: 2px; font-size: 10.5px; overflow-x: auto; }

  .heat .c.m { background: repeating-linear-gradient(45deg, var(--mask), var(--mask) 3px, transparent 3px, transparent 6px); color: var(--muted); }
  .heat .h { color: var(--muted); display: flex; align-items: center; justify-content: center; min-width: 30px; }

  /* Batch */

  /* tensor view */

  .tc-sent { font-size: 12.5px; margin: 6px 0 4px; }
  .tc-sent q { font-style: italic; }
  .tc-sent .lang { color: var(--muted); font-size: 11.5px; }
  svg.tensor { width: 100%; height: auto; max-height: 520px; display: block; margin: 4px 0; font-family: system-ui, Cantarell, "Noto Sans", Arial, sans-serif; }
  svg.tensor .cell { stroke: var(--surface); stroke-width: 0.6; }

  svg.tensor .slab.back { opacity: 0.4; }

  svg.tensor .gcell.pad rect { fill: var(--mint); stroke: var(--accent-2); stroke-dasharray: 3 2; }
  svg.tensor .gcell.blk rect { fill: var(--mint); stroke: var(--accent-2); }
  svg.tensor .gcell.blk text { fill: var(--accent-2); }
  .tc-cap { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
  .subbar { display: flex; align-items: center; gap: 4px; margin: 4px 0 2px; }
  .sb-list { display: flex; gap: 4px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: thin; flex: 1; }
  .sb { flex: none; font-size: 11.5px; cursor: pointer; white-space: nowrap; background: var(--surface-2); border: 1px solid var(--border);
        border-radius: 999px; padding: 2px 9px; }

  .row.subfocus { background: var(--exec-bg); outline: 2px solid var(--accent); outline-offset: -2px; }

  /* Code panel */

  .row.range { background: var(--range-bg); }
  .row.frame { background: var(--frame-bg); border-left-color: var(--frame-bar); }
  .row.exec { background: var(--exec-bg); border-left-color: var(--exec-bar); }
  .row.exec .no, .row.frame .no { opacity: 1; color: var(--text); font-weight: 600; }
  .empty { padding: 16px; color: var(--muted); }
  .legend2 { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
  .legend2 span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .legend2 .e::before { background: var(--exec-bar); }
  .legend2 .f::before { background: var(--frame-bar); }
  .hljs-keyword, .hljs-literal, .hljs-selector-tag { color: var(--tok-keyword); }
  .hljs-string, .hljs-doctag { color: var(--tok-string); }
  .hljs-number { color: var(--tok-number); }
  .hljs-comment, .hljs-quote { color: var(--tok-comment); font-style: italic; }
  .hljs-title, .hljs-section, .hljs-attr { color: var(--tok-title); }
  .hljs-built_in, .hljs-type { color: var(--tok-builtin); }
  .hljs-meta, .hljs-bullet { color: var(--tok-meta); }

  @media (prefers-reduced-motion: reduce) { .arrow.in { animation: none; } }
</style>

<body>
<header>
  <h1>Transformer Architecture Map</h1>
  <label class="cfg-pick" title="Which model size the whole page runs on">Config
    <select id="cfgSel" aria-label="Model configuration"></select></label>
  <div class="chips" id="chips"></div>
  <span class="hdr-tools">
    <span class="menu-wrap">
      <button class="theme-btn" id="layoutBtn" type="button" aria-haspopup="true" aria-expanded="false" title="Arrange the panels">Layout ▾</button>
      <div class="menu" id="layoutMenu" hidden></div>
    </span>
    <button class="theme-btn" id="themeBtn" type="button">Theme</button>
  </span>
</header>

<div class="topbar" id="topbar">
  <div class="player" role="toolbar" aria-label="Step controls">
    <button class="pbtn" id="bFirst" type="button" title="First step (Home)">⏮</button>
    <button class="pbtn" id="bPrev" type="button" title="Previous step (←)">◀</button>
    <button class="pbtn primary" id="bPlay" type="button" title="Play / pause (Space)">▶ Play</button>
    <button class="pbtn" id="bNext" type="button" title="Next step (→)">▶</button>
    <button class="pbtn" id="bLast" type="button" title="Last step (End)">⏭</button>
    <select class="speed" id="speed" aria-label="Playback speed">
      <option value="2000">0.5×</option>
      <option value="1000" selected>1×</option>
      <option value="500">2×</option>
      <option value="200">5×</option>
    </select>
    <input class="scrub" id="scrub" type="range" min="0" value="0" aria-label="Step">
    <span class="counter" id="counter"></span>
  </div>
  <div class="stepline" id="stepLine" aria-live="polite"></div>
</div>

<div class="workspace" id="workspace"></div>

<!-- Panels: moved into the dock layout by js/dock.js. Drag a tab to dock it elsewhere. -->
<div id="panelPool">
  <section class="pnl pnl-col" data-panel="diagram" data-title="Architecture">
    <div class="zoom-frame" id="diagramFrame">
      <div class="flow-tools" id="diagramZoom">
        <button type="button" class="pbtn" data-z="-1" title="Zoom out">−</button>
        <button type="button" class="pbtn" data-z="1" title="Zoom in">+</button>
        <button type="button" class="pbtn" data-fit="1" title="Fit (double-click the background)">Fit</button>
      </div>
      <svg class="diagram" id="diagram" viewBox="0 222 820 700" role="img" aria-label="Transformer encoder-decoder diagram"></svg>
    </div>
    <div class="legend"><span><i></i>data flowing into the running block</span><span><i class="o"></i>where its output goes</span></div>
    <div class="extra" id="extra"></div>
  </section>

  <section class="pnl pnl-col" data-panel="stage" data-title="Operation" id="stagePanel">
    <div class="stage-root" id="stageRoot"></div>

  <section class="pnl pnl-col" data-panel="code" data-title="Code" id="panel" aria-live="polite">
    <div class="ph"><span class="ph-title mono" id="phTitle"></span><span class="ph-sub" id="phSub"></span></div>

<div class="pv-modal" id="pvModal" hidden></div>

<script>
const DATA = /*__DATA__*/null;
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- Local, git-ignored copy of the paper (written by build_ui.py); a missing file is harmless. -->
<script src="paper.local.js"></script>
<script src="js/dock.js"></script>
<script>
(() => {
  // ---------- Configuration preset (tiny 3×3 / small 9×9 / full config.yml) ----------
  const PRESET_KEY = "arch-preset";
  const urlPreset = new URLSearchParams(location.search).get("config");
  let storedPreset = null;
  try { storedPreset = localStorage.getItem(PRESET_KEY); } catch {}
  const PRESET = [urlPreset, storedPreset, "tiny"].find(p => p && DATA.sims[p]);
  const PRESET_INFO = DATA.presets.find(p => p.name === PRESET);
  const C = DATA.components, F = DATA.files, cfg = DATA.configs[PRESET];
  const SIM = DATA.sims[PRESET], STEPS = SIM.steps, B = SIM.batch;
  // Small event bus so other modules (dock, flow graph) can follow the app.
  const listeners = {};
  const emit = (ev, data) => (listeners[ev] || []).forEach(fn => { try { fn(data); } catch (err) { console.error(err); } });
  const topbar = document.getElementById("topbar");
  const syncTb = () => document.documentElement.style.setProperty("--tb", topbar.offsetHeight + "px");
  syncTb();
  if (window.ResizeObserver) new ResizeObserver(syncTb).observe(topbar);
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const fmt = s => "(" + s.join(", ") + ")";
  const uniq = a => [...new Set(a)];

  // ---------- Theme ----------
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const applyTheme = t => t ? document.documentElement.setAttribute("data-theme", t)
                            : document.documentElement.removeAttribute("data-theme");
  // URL parameters (used by demo/capture.py and handy for sharing a view):
  //   ?config=tiny|small|full  &theme=dark|light  &layout=default|flow|code  &sample=1|2  #s=<step>  &stage=<n>
  const QP = new URLSearchParams(location.search);
  applyTheme(QP.get("theme") || store.get("arch-theme"));
  $("themeBtn").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    applyTheme(dark ? "light" : "dark"); store.set("arch-theme", dark ? "light" : "dark");
  });

  // ---------- Config selector + chips ----------
  $("cfgSel").innerHTML = DATA.presets.map(p => `<option value="${p.name}"${p.name === PRESET ? " selected" : ""}>${esc(p.label)}</option>`).join("");
  $("cfgSel").title = PRESET_INFO.blurb;
  $("cfgSel").addEventListener("change", e => {
    try { localStorage.setItem(PRESET_KEY, e.target.value); } catch {}
    const u = new URL(location.href);
    u.searchParams.set("config", e.target.value);
    u.hash = "";
    location.href = u.toString();                 // reload: every panel switches to the new model size
  });
  $("chips").innerHTML = [
    ["d_model", cfg.d_model], ["heads", cfg.n_heads], ["encoder layers", cfg.n_encoder_layers],
    ["decoder layers", cfg.n_decoder_layers], ["d_ff", cfg.d_ff], ["dropout", cfg.dropout],
    ["activation", cfg.activation], ["positional", cfg.positional_encoding], ["max_seq_len", cfg.max_seq_len],
    ["vocab src/tgt", `${cfg.src_vocab_size} / ${cfg.tgt_vocab_size}`], ["tied embeddings", cfg.share_embeddings ? "yes" : "no"],
  ].map(([k, v]) => `<span class="chip">${esc(k)}: <b>${esc(v)}</b></span>`).join("");

  // ---------- Diagram ----------
  const EX = 120, DX = 480, W = 200, ecx = EX + W / 2, dcx = DX + W / 2;
  const fileOf = id => (C[id].refs[0] || {}).file || "";
  const blocks = [
    { key: "input_embedding", id: "input_embedding", x: EX, y: 840, w: W, h: 40, lines: ["Input Embedding"] },
    { key: "pe_enc", id: "positional_encoding", x: 4, y: 790, w: 86, h: 34, lines: ["Positional", "Encoding"], small: true },
    { key: "enc_self_attn", id: "enc_self_attn", x: EX, y: 700, w: W, h: 45, lines: ["Multi-Head Attention"] },
    { key: "enc_norm1", id: "enc_add_norm", x: EX, y: 655, w: W, h: 30, lines: ["Add & Norm"], small: true },
    { key: "enc_ffn", id: "enc_ffn", x: EX, y: 585, w: W, h: 45, lines: ["Feed Forward"] },
    { key: "enc_norm2", id: "enc_add_norm", x: EX, y: 540, w: W, h: 30, lines: ["Add & Norm"], small: true },
    { key: "encoder_stack", id: "encoder_stack", x: 4, y: 606, w: 86, h: 26, lines: [`Encoder ×${cfg.n_encoder_layers}`], small: true, pill: true },
    { key: "encoder_layer", id: "encoder_layer", x: 4, y: 640, w: 86, h: 26, lines: ["EncoderLayer"], small: true, pill: true, mono: true },
    { key: "output_embedding", id: "output_embedding", x: DX, y: 840, w: W, h: 40, lines: ["Output Embedding"] },
    { key: "pe_dec", id: "positional_encoding", x: 728, y: 790, w: 86, h: 34, lines: ["Positional", "Encoding"], small: true },
    { key: "dec_masked_attn", id: "dec_masked_attn", x: DX, y: 700, w: W, h: 45, lines: ["Masked Multi-Head Attention"] },
    { key: "dec_norm1", id: "dec_add_norm", x: DX, y: 655, w: W, h: 30, lines: ["Add & Norm"], small: true },
    { key: "dec_cross_attn", id: "dec_cross_attn", x: DX, y: 585, w: W, h: 45, lines: ["Multi-Head Attention"] },
    { key: "dec_norm2", id: "dec_add_norm", x: DX, y: 540, w: W, h: 30, lines: ["Add & Norm"], small: true },
    { key: "dec_ffn", id: "dec_ffn", x: DX, y: 470, w: W, h: 45, lines: ["Feed Forward"] },
    { key: "dec_norm3", id: "dec_add_norm", x: DX, y: 425, w: W, h: 30, lines: ["Add & Norm"], small: true },
    { key: "decoder_stack", id: "decoder_stack", x: 722, y: 560, w: 94, h: 26, lines: [`Decoder ×${cfg.n_decoder_layers}`], small: true, pill: true },
    { key: "decoder_layer", id: "decoder_layer", x: 722, y: 594, w: 94, h: 26, lines: ["DecoderLayer"], small: true, pill: true, mono: true },
    { key: "linear", id: "linear", x: DX, y: 330, w: W, h: 40, lines: ["Linear"] },
    { key: "softmax", id: "softmax", x: DX, y: 260, w: W, h: 40, lines: ["Softmax"] },
  ];
  const blockByKey = Object.fromEntries(blocks.map(b => [b.key, b]));

  // Arrows: `from` / `to` list the block keys whose activity lights the arrow up.
  const res = (cx, xr, y1, y2) => `M${cx} ${y1} H${xr} V${y2} H${xr - 15}`;
  const arrows = [
    { d: `M${ecx} 895 V880`, from: [], to: ["input_embedding"] },
    { d: `M${ecx} 840 V818`, from: ["input_embedding"], to: ["pe_enc"] },
    { d: `M90 807 H${ecx - 12}`, from: [], to: ["pe_enc"] },
    { d: `M${ecx} 795 V745`, from: ["pe_enc"], to: ["enc_self_attn"] },
    { d: res(ecx, 335, 765, 670), from: ["pe_enc"], to: ["enc_norm1"], dot: [ecx, 765] },
    { d: `M${ecx} 700 V685`, from: ["enc_self_attn"], to: ["enc_norm1"] },
    { d: `M${ecx} 655 V630`, from: ["enc_norm1"], to: ["enc_ffn"] },
    { d: res(ecx, 335, 645, 555), from: ["enc_norm1"], to: ["enc_norm2"], dot: [ecx, 645] },
    { d: `M${ecx} 585 V570`, from: ["enc_ffn"], to: ["enc_norm2"] },
    { d: `M${ecx} 540 V500 H420 V645 H${DX + 40} V630`, from: ["encoder_stack"], to: ["encoder_stack", "dec_cross_attn"] },
    { d: `M${dcx} 895 V880`, from: [], to: ["output_embedding"] },
    { d: `M${dcx} 840 V818`, from: ["output_embedding"], to: ["pe_dec"] },
    { d: `M728 807 H${dcx + 12}`, from: [], to: ["pe_dec"] },
    { d: `M${dcx} 795 V745`, from: ["pe_dec"], to: ["dec_masked_attn"] },
    { d: res(dcx, 695, 765, 670), from: ["pe_dec"], to: ["dec_norm1"], dot: [dcx, 765] },
    { d: `M${dcx} 700 V685`, from: ["dec_masked_attn"], to: ["dec_norm1"] },
    { d: `M${dcx} 655 V630`, from: ["dec_norm1"], to: ["dec_cross_attn"] },
    { d: res(dcx, 695, 645, 555), from: ["dec_norm1"], to: ["dec_norm2"], dot: [dcx, 645] },
    { d: `M${dcx} 585 V570`, from: ["dec_cross_attn"], to: ["dec_norm2"] },
    { d: `M${dcx} 540 V515`, from: ["dec_norm2"], to: ["dec_ffn"] },
    { d: res(dcx, 695, 530, 440), from: ["dec_norm2"], to: ["dec_norm3"], dot: [dcx, 530] },
    { d: `M${dcx} 470 V455`, from: ["dec_ffn"], to: ["dec_norm3"] },
    { d: `M${dcx} 425 V370`, from: ["decoder_stack"], to: ["decoder_stack", "linear"] },
    { d: `M${dcx} 330 V300`, from: ["linear"], to: ["softmax"] },
    { d: `M${dcx} 260 V244`, from: ["softmax"], to: [] },
  ];

  let svg = `
    <defs>
      ${[["ah", "var(--arrow)"], ["ah-in", "var(--accent)"], ["ah-out", "var(--accent-2)"]].map(([id, c]) =>
        `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
           <path d="M0 0 L10 5 L0 10 z" fill="${c}"/></marker>`).join("")}
    </defs>
    <rect class="bracket" id="br-enc" x="${EX - 25}" y="520" width="${W + 50}" height="250" rx="14"/>
    <rect class="bracket" id="br-dec" x="${DX - 25}" y="405" width="${W + 50}" height="365" rx="14"/>
    <text class="badge-t" id="badge-enc" x="${EX - 17}" y="534"></text>
    <text class="badge-t" id="badge-dec" x="${DX - 17}" y="419"></text>
    <text class="lbl" x="${ecx}" y="910" text-anchor="middle">Inputs</text>
    <text class="lbl" x="${dcx}" y="910" text-anchor="middle">Outputs (shifted right)</text>
    <text class="lbl-strong" x="${dcx}" y="236" text-anchor="middle">Output Probabilities</text>
    <text class="lbl" x="318" y="493" text-anchor="middle">memory (K, V)</text>
  `;
  arrows.forEach((a, i) => {
    if (a.dot) svg += `<circle cx="${a.dot[0]}" cy="${a.dot[1]}" r="2.6" fill="var(--arrow)"/>`;
    svg += `<path class="arrow" id="ar${i}" d="${a.d}" marker-end="url(#ah)"/>`;
  });
  svg += `<g class="plus" data-key="pe_enc"><circle cx="${ecx}" cy="807" r="11"/><text x="${ecx}" y="812" text-anchor="middle">+</text></g>
          <g class="plus" data-key="pe_dec"><circle cx="${dcx}" cy="807" r="11"/><text x="${dcx}" y="812" text-anchor="middle">+</text></g>`;
  blocks.forEach(b => {
    const c = C[b.id], file = fileOf(b.id), cx = b.x + b.w / 2;
    const fs = b.small ? 11 : 13, lh = b.small ? 13 : 15;
    const showFile = !b.small && b.h >= 40;
    const n = b.lines.length + (showFile ? 1 : 0);
    const y0 = b.y + b.h / 2 - ((n - 1) * lh) / 2 + fs * 0.35;
    svg += `<g class="blk k-${c.kind}" data-id="${b.id}" data-key="${b.key}" tabindex="0" role="button" aria-label="${esc(c.label)} (${esc(file)})">
      <title>${esc(c.label)}: ${esc(c.refs.map(r => r.file + (r.symbol ? " · " + r.symbol : "")).join(", "))}</title>
      <rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="${b.pill ? 13 : 7}"/>
      ${b.lines.map((l, j) => `<text x="${cx}" y="${y0 + j * lh}" text-anchor="middle" font-size="${fs}"${b.mono ? ' class="mono"' : ""} font-weight="${b.small ? 500 : 600}">${esc(l)}</text>`).join("")}
      ${showFile ? `<text class="file mono" x="${cx}" y="${y0 + b.lines.length * lh - 2}" text-anchor="middle">${esc(file)}</text>` : ""}
    </g>`;
  });
  svg += `<g id="shapeTag" style="display:none" pointer-events="none"><rect rx="8" height="16"/><text y="11.5" class="mono"></text></g>`;
  const diagram = $("diagram");
  diagram.innerHTML = svg;
  // Keep every label inside its block: shrink the font of any text wider than its box.
  function fitDiagramText() {
    diagram.querySelectorAll(".blk").forEach(g => {
      const box = g.querySelector("rect").getBBox();
      g.querySelectorAll("text").forEach(t => {
        t.style.fontSize = "";
        const w = t.getBBox().width, room = box.width - 8;
        if (w > room && w > 0) {
          const fs = parseFloat(getComputedStyle(t).fontSize) || 12;
          t.style.fontSize = `${(fs * room / w).toFixed(2)}px`;
        }
      });
    });
  }
  requestAnimationFrame(fitDiagramText);

  // ---------- Architecture diagram: zoom (buttons, wheel) and pan (drag the background) ----------
  const DIAGRAM_BOX = [0, 222, 820, 700];
  let dz = DIAGRAM_BOX.slice();
  const setDz = () => diagram.setAttribute("viewBox", dz.map(v => v.toFixed(1)).join(" "));
  function zoomDiagram(f, fx = 0.5, fy = 0.5) {
    const w = Math.min(DIAGRAM_BOX[2] * 1.5, Math.max(120, dz[2] / f)), h = w * DIAGRAM_BOX[3] / DIAGRAM_BOX[2];
    dz = [dz[0] + (dz[2] - w) * fx, dz[1] + (dz[3] - h) * fy, w, h];
    setDz();
  }
  $("diagramZoom").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.fit) { dz = DIAGRAM_BOX.slice(); setDz(); } else zoomDiagram(+b.dataset.z > 0 ? 1.25 : 0.8);
  });
  diagram.addEventListener("wheel", e => {
    e.preventDefault();
    const r = diagram.getBoundingClientRect();
    zoomDiagram(e.deltaY < 0 ? 1.12 : 1 / 1.12, (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
  }, { passive: false });
  let dpan = null;
  diagram.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.target.closest(".blk")) return;
    dpan = { x: e.clientX, y: e.clientY, box: dz.slice(), s: dz[2] / diagram.getBoundingClientRect().width };
    diagram.classList.add("panning");
  });
  window.addEventListener("pointermove", e => {
    if (!dpan) return;
    dz = [dpan.box[0] - (e.clientX - dpan.x) * dpan.s, dpan.box[1] - (e.clientY - dpan.y) * dpan.s, dz[2], dz[3]];
    setDz();
  });
  window.addEventListener("pointerup", () => { dpan = null; diagram.classList.remove("panning"); });
  diagram.addEventListener("dblclick", e => { if (!e.target.closest(".blk")) { dz = DIAGRAM_BOX.slice(); setDz(); } });

  // ---------- Extras & files ----------
  const extraIds = ["transformer", "padding_mask", "config", "self_attention", "main"];
  $("extra").innerHTML = extraIds.map(id =>
    `<button type="button" data-id="${id}" data-key="${id}">${esc(C[id].label)}</button>`).join("");
  $("files").innerHTML = Object.entries(F).map(([name, f]) => {
    const labels = uniq(f.blocks.map(id => C[id].label));
    return `<li><button type="button" data-file="${esc(name)}"><span class="fname mono">${esc(name)}</span>
      <span class="fblocks">${labels.length ? esc(labels.join(", ")) : "—"}</span></button></li>`;
  }).join("");

  // ---------- Batch ----------
  // id -> word, per side (source / target vocabulary)
  const word = (id, side) => (side === "src" ? B.src_vocab : B.tgt_vocab)[id] ?? String(id);
  const tokLabel = (id, side = "src") => word(id, side);
  const tokCls = id => id === B.pad ? "pad" : (id === B.bos || id === B.eos) ? "sp" : "";
  const block = (id, side, title = "") =>
    `<span class="tok ${tokCls(id)}"${title ? ` title="${esc(title)}"` : ""}><span class="w">${esc(word(id, side))}</span><span class="id mono">${id}</span></span>`;

  // ---------- Code rendering ----------
  const lineCache = {};
  function splitLines(html) {
    const out = [], open = [];
    let cur = "";
    const re = /<span[^>]*>|<\/span>|[^<]+/g;
    let m;
    while ((m = re.exec(html))) {
      const t = m[0];
      if (t.startsWith("<span")) { open.push(t); cur += t; }
      else if (t === "</span>") { open.pop(); cur += t; }
      else t.split("\n").forEach((p, i) => {
        if (i > 0) { cur += "</span>".repeat(open.length); out.push(cur); cur = open.join(""); }
        cur += p;
      });
    }
    out.push(cur);
    return out;
  }
  function fileLines(name) {
    if (lineCache[name]) return lineCache[name];
    const code = F[name].code, lang = /\.ya?ml$/.test(name) ? "yaml" : "python";
    let html;
    try { html = window.hljs ? hljs.highlight(code, { language: lang, ignoreIllegals: true }).value : esc(code); }
    catch { html = esc(code); }
    return (lineCache[name] = splitLines(html));
  }
  // ---------- Implementation notes (details not in the paper) ----------
  const IMPL = DATA.impl || [];
  const IMPL_BY_ID = Object.fromEntries(IMPL.map(n => [n.id, n]));
  const rangesLabel = lines => {
    const out = [];
    let a = lines[0], b = lines[0];
    for (const n of lines.slice(1).concat([null])) {
      if (n === b + 1) { b = n; continue; }
      out.push(a === b ? `${a}` : `${a}–${b}`);
      a = b = n;
    }
    return out.join(", ");
  };

  function renderCode(name, { exec = [], frame = [], range = null, first = null, implOpen = [], implActive = null, focus = null, def = null } = {}) {
    const box = $("code");
    if (!name || !F[name]) { box.innerHTML = `<div class="empty">No project code runs in this step.</div>`; return; }
    const ex = new Set(exec), fr = new Set(frame);
    const notes = IMPL.filter(n => n.file === name);
    const open = new Set(implOpen.concat(implActive ? [implActive] : []));
    const noteAt = {};
    notes.forEach(n => n.lines.forEach(l => (noteAt[l] = noteAt[l] || []).push(n)));
    const calloutAfter = {};
    notes.filter(n => open.has(n.id)).forEach(n => (calloutAfter[Math.max(...n.lines)] = calloutAfter[Math.max(...n.lines)] || []).push(n));
    const act = implActive ? new Set(IMPL_BY_ID[implActive].lines) : new Set();
    const lines = fileLines(name);
    box.innerHTML = `<div class="lines">${lines.map((l, i) => {
      const n = i + 1;
      let cls = ex.has(n) ? "exec" : fr.has(n) ? "frame" : (range && n >= range[0] && n <= range[1]) ? "range" : "";
      if (noteAt[n]) cls += " impl";
      if (act.has(n)) cls += " implact";
      if (n === focus) cls += " subfocus";
      if (n === def) cls += " subdef";
      const mark = noteAt[n] ? `<button class="im" type="button" data-note="${noteAt[n][0].id}" title="Not in the paper: ${esc(noteAt[n][0].title)}">◆</button>` : `<span class="im0"></span>`;
      let row = `<div class="row ${cls}">${mark}<span class="no">${n}</span><span class="src">${l || " "}</span></div>`;
      (calloutAfter[n] || []).forEach(note => {
        row += `<div class="callout${note.id === implActive ? " act" : ""}" data-note="${note.id}">
          <div class="ct">◆ Not in the paper · ${esc(note.title)}</div><div class="cx">${esc(note.text)}</div>${
          note.math ? `<div class="cm">${note.math}</div>` : ""}</div>`;
      });
      return row;
    }).join("")}</div>`;
    box.querySelectorAll(".im").forEach(b => b.addEventListener("click", () => showImpl(b.dataset.note)));
    // Keep callouts inside the visible width even when long code lines scroll horizontally.
    box.querySelectorAll(".callout").forEach(c => (c.style.maxWidth = Math.min(760, box.clientWidth - 90) + "px"));
    const target = focus ? focus : implActive ? Math.min(...IMPL_BY_ID[implActive].lines)
      : first || (exec.length ? Math.min(...exec) : frame.length ? Math.min(...frame) : range ? range[0] : 1);
    const row = box.querySelectorAll(".row")[target - 1];
    if (row) box.scrollTop = Math.max(0, row.offsetTop - box.clientHeight * 0.28);
  }

  function showImpl(id) {
    const n = IMPL_BY_ID[id];
    if (!n) return;
    setPlaying(false);
    exploring = true;
    $("phTitle").textContent = n.file;
    $("phSub").textContent = `lines ${rangesLabel(n.lines)}`;
    $("phNote").textContent = "Implementation detail not described in the paper. Press ▶ / → to return to the step-through.";
    $("stack").innerHTML = "";
    renderCode(n.file, { implActive: id });
    document.querySelectorAll("#paperPanel [data-impl]").forEach(b => b.classList.toggle("on", b.dataset.impl === id));
  }

  // ---------- Paper tile ----------
  const P = DATA.paper;
  let paperKey = null;
  const L = P.local;  // {file, npages, sizes} or null when no local PDF was found at build time
  const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  let pdfDoc = null, pdfLoading = null;
  let pv = { entry: null, page: 1, active: null };
  const renderTokens = new WeakMap();

  async function setupWorker() {
    if (!window.pdfjsLib) throw new Error("pdf.js failed to load (offline?)");
    if (pdfjsLib.GlobalWorkerOptions.workerSrc) return;
    try {  // a same-origin blob URL avoids cross-origin worker restrictions
      const blob = await (await fetch(PDFJS + "pdf.worker.min.js")).blob();
      pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
    } catch { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; }
  }
  async function openPdf(source) {
    await setupWorker();
    pdfDoc = await pdfjsLib.getDocument(source).promise;
    return pdfDoc;
  }
  function ensurePdf() {
    if (pdfDoc) return Promise.resolve(pdfDoc);
    if (!pdfLoading) {
      let source = { url: encodeURI(L.file) };
      if (window.PAPER_PDF_B64) {  // embedded copy: works even from file://
        const bin = atob(window.PAPER_PDF_B64);
        const data = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) data[i] = bin.charCodeAt(i);
        source = { data };
      }
      pdfLoading = openPdf(source).catch(err => { pdfLoading = null; throw err; });
    }
    return pdfLoading;
  }
  const totalPages = () => (pdfDoc ? pdfDoc.numPages : L.npages);

  function marksHtml(entry, page, scale) {
    let h = "";
    entry.points.forEach((pt, i) => (pt.hl || []).filter(x => x.page === page).forEach(x => x.rects.forEach(r => {
      const cls = i === pv.active ? "act" : entry.focus.includes(i) ? "foc" : "oth";
      h += `<div class="hlr ${cls}" style="left:${r[0] * scale - 1}px;top:${r[1] * scale - 1}px;width:${(r[2] - r[0]) * scale + 2}px;height:${(r[3] - r[1]) * scale + 2}px"></div>`;
    })));
    return h;
  }

  function loadPrompt(box, err) {
    const isFile = location.protocol === "file:";
    box.innerHTML = `<div class="pv-load">
      <p>${isFile && !window.PAPER_PDF_B64
            ? "The local copy of the paper (ui/paper.local.js) wasn't found, so the PDF can't load automatically."
            : "Couldn't load the paper PDF" + (err ? ` (${esc(err.message || err)})` : "") + "."}</p>
      <label class="pbtn primary">Load PDF…<input type="file" accept="application/pdf" hidden></label>
      <p class="pfoot">Re-run <span class="mono">.venv/bin/python ui/build_ui.py</span> to recreate it, or pick <span class="mono">ui/${esc(L.file)}</span> with the button.</p></div>`;
    box.querySelector("input").addEventListener("change", async ev => {
      const f = ev.target.files[0];
      if (!f) return;
      try { await openPdf({ data: new Uint8Array(await f.arrayBuffer()) }); redrawViewers(); }
      catch (e2) { loadPrompt(box, e2); }
    });
  }

  async function drawViewer(root) {
    if (!root || !L) return;
    const box = root.querySelector(".pv");
    if (!box) return;
    const token = {};
    renderTokens.set(box, token);
    root.querySelectorAll(".pv-pno").forEach(el => el.textContent = `page ${pv.page} / ${totalPages()}`);
    root.querySelectorAll(".pv-open").forEach(a => a.href = `${encodeURI(L.file)}#page=${pv.page}`);
    try { await ensurePdf(); } catch (err) { if (renderTokens.get(box) === token) loadPrompt(box, err); return; }
    root.querySelectorAll(".pv-pno").forEach(el => el.textContent = `page ${pv.page} / ${totalPages()}`);
    const page = await pdfDoc.getPage(pv.page);
    if (renderTokens.get(box) !== token) return;
    const base = page.getViewport({ scale: 1 });
    if (box.clientWidth < 60) return;  // panel hidden or collapsed: redrawn on resize
    const scale = (box.clientWidth - 16) / base.width;
    const vp = page.getViewport({ scale });
    const dpr = window.devicePixelRatio || 1;
    const wrap = document.createElement("div");
    wrap.className = "pv-page";
    wrap.style.width = vp.width + "px";
    wrap.style.height = vp.height + "px";
    const canvas = document.createElement("canvas");
    canvas.width = Math.floor(vp.width * dpr);
    canvas.height = Math.floor(vp.height * dpr);
    canvas.style.width = vp.width + "px";
    canvas.style.height = vp.height + "px";
    const marks = document.createElement("div");
    marks.className = "hl-layer";
    marks.innerHTML = marksHtml(pv.entry, pv.page, scale);
    const text = document.createElement("div");
    text.className = "textLayer";
    text.style.setProperty("--scale-factor", scale);
    wrap.append(canvas, marks, text);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport: page.getViewport({ scale: scale * dpr }) }).promise;
    if (renderTokens.get(box) !== token) return;
    box.replaceChildren(wrap);
    try {
      const tc = await page.getTextContent();
      pdfjsLib.renderTextLayer({ textContentSource: tc, container: text, viewport: vp, textDivs: [] });
    } catch { /* text selection is optional */ }
    const target = marks.querySelector(".hlr.act") || marks.querySelector(".hlr.foc") || marks.querySelector(".hlr");
    box.scrollTop = target ? Math.max(0, target.offsetTop - box.clientHeight * 0.3) : 0;
  }
  function redrawViewers() { drawViewer($("paperPanel")); if (!$("pvModal").hidden) drawViewer($("pvModal")); }

  function selectPoint(i) {
    const pt = pv.entry.points[i];
    pv.active = i;
    if (pt.hl && pt.hl.length) pv.page = pt.hl[0].page;
    document.querySelectorAll("#paperPanel .points li").forEach(li => li.classList.toggle("act", +li.dataset.pt === i));
    redrawViewers();
  }
  function turnPage(d) {
    const n = pv.page + d;
    if (n >= 1 && n <= totalPages()) { pv.page = n; redrawViewers(); }
  }

  function viewerBar(expand) {
    return `<div class="pv-bar">
      <span class="pv-title">Your PDF · <span class="pv-pno"></span></span>
      <button class="pbtn pv-prev" type="button" title="Previous page">◀</button>
      <button class="pbtn pv-next" type="button" title="Next page">▶</button>
      ${expand ? `<button class="pbtn pv-expand" type="button" title="Open a large view">Expand</button>`
               : `<button class="pbtn pv-close" type="button" title="Close (Esc)">Close</button>`}
      <a class="sec pv-open" target="_blank" rel="noopener">Open PDF ↗</a></div>`;
  }
  function wireBar(root) {
    root.querySelector(".pv-prev").addEventListener("click", () => turnPage(-1));
    root.querySelector(".pv-next").addEventListener("click", () => turnPage(1));
    const ex = root.querySelector(".pv-expand");
    if (ex) ex.addEventListener("click", openModal);
    const cl = root.querySelector(".pv-close");
    if (cl) cl.addEventListener("click", closeModal);
  }
  function openModal() {
    const m = $("pvModal");
    m.innerHTML = `<div class="pv-modal-inner" role="dialog" aria-label="Paper page">${viewerBar(false)}<div class="pv big"></div></div>`;
    m.hidden = false;
    wireBar(m);
    drawViewer(m);
  }
  function closeModal() { $("pvModal").hidden = true; }
  $("pvModal").addEventListener("click", e => { if (e.target.id === "pvModal") closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("pvModal").hidden) closeModal(); }, true);

  function renderPaper(key) {
    const e = P.entries[key];
    if (!e || key === paperKey) return;
    paperKey = key;
    const refs = e.refs.map((r, i) => `<a class="sec" href="${esc(r.url)}" target="_blank" rel="noopener">${
      /^\d/.test(r.sec) ? "§" : ""}${esc(r.sec)} ${esc(r.title)} ↗</a>${
      L && r.page ? `<button class="sec pg" type="button" data-page="${r.page}" title="Show this page of your PDF">p. ${r.page}</button>` : ""}`).join("");
    const table = e.table ? `<table class="cmp"><thead><tr><th>setting</th><th>paper</th><th>config.yml</th></tr></thead><tbody>${
      e.table.map(r => `<tr class="${r.same ? "" : "diff"}"><td>${esc(r.name)}</td><td class="mono">${esc(r.paper)}</td><td class="mono">${esc(r.code)}</td></tr>`).join("")
    }</tbody></table>` : "";
    const points = e.points.map((p, i) => {
      const pages = uniq((p.hl || []).map(h => h.page));
      const link = L && pages.length ? `<span class="pgtag">p. ${pages.join("–")}</span>` : "";
      return `<li class="${e.focus.includes(i) ? "focus" : ""}${pages.length && L ? " linked" : ""}" data-pt="${i}"${
        pages.length && L ? ` tabindex="0" role="button" title="Show this passage in your PDF"` : ""}>${esc(p.text)}${link}</li>`;
    }).join("");
    const notes = IMPL.filter(n => n.comps.includes(key));
    const implList = notes.length ? `<div class="implbox"><h3>◆ Not in the paper: implementation details</h3>${
      notes.map(n => `<button class="implitem" type="button" data-impl="${n.id}">
        <span class="it">${esc(n.title)}</span><span class="il mono">${esc(n.file)}:${rangesLabel(n.lines)}</span>
        <span class="ix">${esc(n.text)}</span>${n.math ? `<span class="cm">${n.math}</span>` : ""}</button>`).join("")}</div>` : "";
    $("paperPanel").innerHTML = `
      <h2>In the paper</h2>
      <div class="ptitle"><a href="${esc(P.url)}" target="_blank" rel="noopener">${esc(P.title)}</a> · <a href="${esc(P.pdf)}" target="_blank" rel="noopener">arXiv PDF</a></div>
      <div class="secs">${refs}</div>
      ${e.eq ? `<div class="eq">${e.eq}</div>` : ""}
      <ul class="points">${points}</ul>
      ${implList}
      ${L ? viewerBar(true) + `<div class="pv"></div>` : `<p class="pfoot">Put the paper PDF in <span class="mono">ui/</span> and re-run build_ui.py to see the highlighted passages on the real pages.</p>`}
      ${table}
      <div class="incode"><b>In this code</b>${esc(e.code)}</div>
      <p class="pfoot">Highlighted notes are the ones relevant to the current step${L ? "; click a note to see its passage on the page" : ""}. The notes paraphrase the paper; the highlights point at the original text in your copy.</p>
      <details class="legal"><summary>Copyright &amp; attribution</summary>
        <p><b>Source:</b> ${esc(P.citation)}</p>
        <p><b>Permission notice (from the paper):</b> “${esc(P.notice)}”</p>
        <p><b>Disclaimer:</b> ${esc(P.disclaimer)}</p>
        ${L ? `<p><b>Local copy:</b> ${esc(P.local_notice)}</p>` : ""}
      </details>`;
    $("paperPanel").querySelectorAll("[data-impl]").forEach(b => b.addEventListener("click", () => showImpl(b.dataset.impl)));

    if (!L) return;
    const firstWith = idx => idx.find(i => e.points[i].hl && e.points[i].hl.length);
    const all = e.points.map((_, i) => i);
    const start = firstWith(e.focus) ?? firstWith(all);
    pv = { entry: e, active: null,
           page: start != null ? e.points[start].hl[0].page : (e.refs.find(r => r.page) || {}).page ?? 1 };
    const panel = $("paperPanel");
    wireBar(panel);
    panel.querySelectorAll(".points li.linked").forEach(li => {
      li.addEventListener("click", () => selectPoint(+li.dataset.pt));
      li.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); ev.stopPropagation(); selectPoint(+li.dataset.pt); } });
    });
    panel.querySelectorAll(".pg").forEach(b => b.addEventListener("click", () => { pv.page = +b.dataset.page; pv.active = null; redrawViewers(); }));
    redrawViewers();
  }

  // ---------- Step mode ----------
  let cur = 0, timer = null, exploring = false;
  const scrub = $("scrub");
  scrub.max = STEPS.length - 1;

  function clearMarks() {
    document.querySelectorAll(".active,.selected,.hl,.running").forEach(el => el.classList.remove("active", "selected", "hl", "running"));
    arrows.forEach((a, i) => { const p = $("ar" + i); p.classList.remove("in", "out"); p.setAttribute("marker-end", "url(#ah)"); });
    $("badge-enc").textContent = ""; $("badge-dec").textContent = "";
    $("shapeTag").style.display = "none";
  }

  function showShapeTag(step) {
    const b = blockByKey[step.block];
    const firstIn = (step.inputs.find(i => i.shape) || {}).shape;
    if (!b || !step.out_shape || !step.out_shape.length) return;
    const txt = (firstIn ? fmt(firstIn) + " → " : "→ ") + fmt(step.out_shape);
    const tag = $("shapeTag"), w = txt.length * 6.4 + 12;
    const x = Math.min(Math.max(b.x + b.w - w, 2), 818 - w);
    const y = b.y - 18 < 226 ? b.y + b.h + 2 : b.y - 18;
    tag.setAttribute("transform", `translate(${x},${y})`);
    tag.querySelector("rect").setAttribute("width", w);
    const t = tag.querySelector("text"); t.setAttribute("x", 6); t.textContent = txt;
    tag.style.display = "";
  }



  let sample = Math.max(0, (+QP.get("sample") || 1) - 1);

  // ---------- Sub-step + sample state (drawn by js/stage.js) ----------
  let sub = -1;  // -1 = step overview; otherwise index into step.subs
  function selectSub(i, keepPlaying = false) {
    const step = STEPS[cur], n = (step.subs || []).length;
    sub = Math.max(-1, Math.min(n - 1, i));
    if (!keepPlaying) setPlaying(false);
    renderStepCode(step, sub >= 0 ? { sub } : null);
    emit("sub", { cur, sub });
  }
  function setSample(b) {
    sample = b;
    renderStepCard(STEPS[cur]);
    emit("sample", { sample });
  }

  function renderStepCard(step) {
    const layer = step.layer ? ` <span class="chip">layer ${step.layer} / ${step.nlayers}</span>` : "";
    const ins = step.inputs.map(i => `<tr><td class="dir">in</td><td class="mono">${esc(i.name)}</td>
        <td class="mono shape">${i.shape ? esc(fmt(i.shape)) : esc(i.value)}</td><td class="mono">${esc(i.dtype || "int")}</td></tr>`).join("");
    const out = step.out_shape && step.out_shape.length
      ? `<tr class="outrow"><td class="dir">out</td><td class="mono">output</td><td class="mono shape">${esc(fmt(step.out_shape))}</td><td class="mono">${esc(step.out_dtype || "")}</td></tr>` : "";
    let extra = "";
    if (step.topk_logits) {
      const t = step.topk_logits;
      extra += `<div class="sub"><span>Top-5 logits · sample 1, position ${t.pos}</span></div><table class="topk">${t.ids.map((id, i) =>
        `<tr><td class="mono">${esc(B.tgt_vocab[id] ?? "token " + id)}</td><td class="mono">${t.logits[i].toFixed(3)}</td></tr>`).join("")}</table>`;
    }
    if (step.topk) {
      extra += step.topk.map((t, b) => `<div class="sub"><span>Top-5 next-token probabilities · sample ${b + 1}, position ${t.pos}</span></div>
        <table class="topk">${t.ids.map((id, i) => `<tr><td class="mono" style="width:90px">${esc(B.tgt_vocab[id] ?? "token " + id)}</td>
          <td style="width:60%"><div class="bar" style="width:${Math.max(2, t.probs[i] / t.probs[0] * 100)}%"></div></td>
          <td class="mono">${(t.probs[i] * 100).toFixed(3)}%</td></tr>`).join("")}</table>`).join("");
      extra += `<p class="step-desc">The weights are untrained, so the probabilities are close to uniform (1 / ${cfg.tgt_vocab_size}).</p>`;
    }
    $("stepCard").innerHTML = `
      <h2>Step ${cur + 1} of ${STEPS.length}</h2>
      <h3 class="step-title">${esc(step.title)}${layer}</h3>
      <p class="step-desc">${esc(step.desc)}</p>
      <table class="dims"><thead><tr><th></th><th>tensor</th><th>shape</th><th>dtype</th></tr></thead><tbody>${ins}${out}</tbody></table>
      ${extra}`;

  }

  function renderStepCode(step, view = null) {
    const frames = step.frames || [];
    const files = Object.keys(step.exec);
    const chips = frames.map((f, i) =>
      `<button class="fr frame${view && view.frame === i ? " on" : ""}" type="button" data-frame="${i}" title="${esc(f.func)}">${esc(f.file)}:${f.line} <span style="opacity:.7">${esc(f.func)}</span></button>`);
    files.forEach(fn => chips.push(
      `<button class="fr exec${(!view && fn === step.primary) || (view && view.file === fn) ? " on" : ""}" type="button" data-exec="${esc(fn)}">${esc(fn)} · ${step.exec[fn].length} line${step.exec[fn].length > 1 ? "s" : ""} ran</button>`));
    $("stack").innerHTML = chips.length ? `<span class="sep">call stack:</span>` + chips.join(`<span class="sep">→</span>`) : "";
    $("stack").querySelectorAll("[data-frame]").forEach(b => b.addEventListener("click", () => renderStepCode(step, { frame: +b.dataset.frame })));
    $("stack").querySelectorAll("[data-exec]").forEach(b => b.addEventListener("click", () => renderStepCode(step, { file: b.dataset.exec })));

    let file, opts;
    const subv = view && view.sub !== undefined ? step.subs[view.sub] : null;
    if (subv) {
      file = subv.file;
      opts = { exec: step.exec[file] || [], frame: frames.filter(f => f.file === file).map(f => f.line), focus: subv.line,
               def: subv.def && subv.def.file === file ? subv.def.line : null };
    } else if (view && view.frame !== undefined) {
      const f = frames[view.frame];
      file = f.file; opts = { frame: [f.line], exec: step.exec[f.file] || [] };
    } else {
      file = (view && view.file) || step.primary;
      opts = { exec: step.exec[file] || [], frame: frames.filter(f => f.file === file).map(f => f.line),
               first: (step.first || {})[file] };
    }
    // Show the callouts for implementation details that belong to this step's block.
    opts.implOpen = IMPL.filter(n => n.file === file && (n.comps.includes(step.key) || n.comps.includes(step.comp))).map(n => n.id);
    $("phTitle").textContent = file || "—";
    $("phSub").textContent = file && opts.exec.length ? `${opts.exec.length} line${opts.exec.length > 1 ? "s" : ""} executed` : "";
    $("phNote").textContent = subv
      ? (subv.file ? `Sub-step ${view.sub + 1}: ${subv.label} (line ${subv.line}, outlined)` : `Sub-step ${view.sub + 1}: ${subv.label}. Computed outside the model, so there's no project code for it.`)
      : step.primary ? "" : "This step happens outside the model (no project code runs).";
    renderCode(file, opts);
  }

  function goto(i, updateHash = true) {
    cur = Math.max(0, Math.min(STEPS.length - 1, i));
    exploring = false;
    sub = -1;
    const step = STEPS[cur];
    clearMarks();
    document.querySelectorAll(`[data-key="${step.block}"]`).forEach(el => el.classList.add("active"));
    if (!step.key.endsWith("_mask")) {
      arrows.forEach((a, j) => {
        const p = $("ar" + j);
        if (a.to.includes(step.block)) { p.classList.add("in"); p.setAttribute("marker-end", "url(#ah-in)"); }
        else if (a.from.includes(step.block)) { p.classList.add("out"); p.setAttribute("marker-end", "url(#ah-out)"); }
      });
    }
    if (step.layer && step.key.startsWith("enc")) { $("br-enc").classList.add("running"); $("badge-enc").textContent = `layer ${step.layer}/${step.nlayers}`; }
    if (step.layer && step.key.startsWith("dec")) { $("br-dec").classList.add("running"); $("badge-dec").textContent = `layer ${step.layer}/${step.nlayers}`; }
    if (step.key === "enc_final") $("br-enc").classList.add("running");
    if (step.key === "dec_final") $("br-dec").classList.add("running");
    showShapeTag(step);
    $("counter").innerHTML = `Step <b>${cur + 1}</b> / ${STEPS.length}`;
    const inDims = step.inputs.filter(x => x.shape).map(x => `${x.name} ${fmt(x.shape)}`).join(", ");
    $("stepLine").innerHTML = `<b>${esc(step.title)}</b><span class="dimsline mono">${esc(inDims || "—")} → ${
      step.out_shape && step.out_shape.length ? esc(fmt(step.out_shape)) : "—"}</span>`;
    scrub.value = cur;
    renderStepCard(step);
    renderStepCode(step);
    renderPaper(P.entries[step.key] ? step.key : step.comp);
    if (updateHash) history.replaceState(null, "", "#s=" + (cur + 1));
    emit("step", { cur, sub });
  }

  function setPlaying(on) {
    clearInterval(timer); timer = null;
    $("bPlay").textContent = on ? "⏸ Pause" : "▶ Play";
    if (on) {
      if (cur >= STEPS.length - 1) goto(0);
      timer = setInterval(() => {
        const drv = window.App && window.App.stageDriver;
        if (drv && drv.advance()) return;                 // next stage of this operation
        if (cur >= STEPS.length - 1) setPlaying(false); else goto(cur + 1);
      }, +$("speed").value);
    }
  }
  $("bPlay").addEventListener("click", () => setPlaying(!timer));
  // After exploring a block, the first Next/Prev returns to the current step instead of moving.
  const stepBy = d => { setPlaying(false); goto(exploring ? cur : cur + d); };
  $("bNext").addEventListener("click", () => stepBy(1));
  $("bPrev").addEventListener("click", () => stepBy(-1));
  $("bFirst").addEventListener("click", () => { setPlaying(false); goto(0); });
  $("bLast").addEventListener("click", () => { setPlaying(false); goto(STEPS.length - 1); });
  $("speed").addEventListener("change", () => { if (timer) setPlaying(true); });
  scrub.addEventListener("input", () => { setPlaying(false); goto(+scrub.value); });
  document.addEventListener("keydown", e => {
    // Form controls (including the step slider) handle their own arrow keys.
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.shiftKey && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      e.preventDefault();
      const dlt = e.key === "ArrowRight" ? 1 : -1;
      if (window.App && window.App.stageDriver) { setPlaying(false); window.App.stageDriver.step(dlt); } else selectSub(sub + dlt);
    }
    else if (e.key === "ArrowRight") { e.preventDefault(); stepBy(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); stepBy(-1); }
    else if (e.key === "Home") { e.preventDefault(); setPlaying(false); goto(0); }
    else if (e.key === "End") { e.preventDefault(); setPlaying(false); goto(STEPS.length - 1); }
    else if (e.key === " " && !e.target.closest(".blk, button, a")) { e.preventDefault(); setPlaying(!timer); }
  });

  // ---------- Explore mode (click a block / file) ----------
  function explore(title, note, refs) {
    setPlaying(false);
    exploring = true;
    let active = 0;
    const draw = () => {
      const r = refs[active];
      $("phTitle").textContent = title;
      $("phSub").textContent = `${r.file}:${r.start}-${r.end}`;
      $("phNote").textContent = note + "  Press ▶ / → to return to the step-through.";
      $("stack").innerHTML = refs.length > 1 ? refs.map((x, i) =>
        `<button class="fr${i === active ? " on" : ""}" type="button" data-ref="${i}">${esc(x.file)}${x.symbol ? " · " + esc(x.symbol) : ""}</button>`).join("") : "";
      $("stack").querySelectorAll("[data-ref]").forEach(b => b.addEventListener("click", () => { active = +b.dataset.ref; draw(); }));
      renderCode(r.file, { range: [r.start, r.end] });
    };
    draw();
  }
  // Steps that belong to a clicked block (by its diagram key).
  function stepsFor(key) {
    const alias = { encoder_layer: "enc_self_attn", decoder_layer: "dec_masked_attn" };
    return STEPS.map((st, i) => [st, i])
      .filter(([st]) => (alias[key] ? st.key === alias[key] : st.block === key))
      .map(([, i]) => i);
  }

  // Clicking a block jumps the whole page (tensor, step card, code, paper) to that block's step.
  // Same block again → its next occurrence (next layer); otherwise stay in the current layer if possible.
  function jumpToBlock(key, id) {
    const cands = stepsFor(key);
    if (!cands.length) return selectComponent(id);
    const now = STEPS[cur];
    let target;
    if (cands.includes(cur)) target = cands[(cands.indexOf(cur) + 1) % cands.length];
    else {
      const sameLayer = cands.find(i => now.layer && STEPS[i].layer === now.layer && STEPS[i].key.slice(0, 3) === now.key.slice(0, 3));
      target = sameLayer ?? cands[0];
    }
    setPlaying(false);
    goto(target);
  }

  // For things that aren't a single step of the forward pass: refresh every card, not just the code.
  function showComponentCards(title, note) {
    clearMarks();
    $("stepCard").innerHTML = `<h2>Component</h2><h3 class="step-title">${esc(title)}</h3><p class="step-desc">${esc(note)}</p>`;
    $("stepLine").innerHTML = `<b>${esc(title)}</b><span class="dimsline">exploring (not a forward-pass step)</span>`;
    $("counter").innerHTML = `exploring · press ▶ to return to step <b>${cur + 1}</b>`;
  }

  function selectComponent(id) {
    const c = C[id]; if (!c) return;
    showComponentCards(c.label, c.note);
    document.querySelectorAll(".selected").forEach(el => el.classList.remove("selected"));
    document.querySelectorAll(`[data-id="${id}"]`).forEach(el => el.classList.add("selected"));
    explore(c.label, c.note, c.refs);
    renderPaper(id);
    history.replaceState(null, "", "#c=" + id);
  }
  function selectFile(name) {
    const f = F[name]; if (!f) return;
    document.querySelectorAll(".selected").forEach(el => el.classList.remove("selected"));
    document.querySelectorAll(`[data-file="${CSS.escape(name)}"]`).forEach(el => el.classList.add("selected"));
    const labels = uniq(f.blocks.map(id => C[id].label));
    showComponentCards(name, labels.length ? "Implements: " + labels.join(", ") + "." : "Not mapped to a diagram block.");
    document.querySelectorAll(`[data-file="${CSS.escape(name)}"]`).forEach(el => el.classList.add("selected"));
    explore(name, labels.length ? "Implements: " + labels.join(", ") + "." : "Not mapped to a diagram block.",
            [{ file: name, symbol: null, start: 1, end: Math.max(f.lines, 1) }]);
    history.replaceState(null, "", "#f=" + encodeURIComponent(name));
  }
  document.addEventListener("click", e => {
    const b = e.target.closest(".blk[data-id], .extra [data-id]");
    if (b) return jumpToBlock(b.dataset.key || b.dataset.id, b.dataset.id);
    const f = e.target.closest("[data-file]");
    if (f) selectFile(f.dataset.file);
  });
  diagram.addEventListener("keydown", e => {
    const g = e.target.closest(".blk");
    if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.stopPropagation(); jumpToBlock(g.dataset.key, g.dataset.id); }
  });
  const filesEl = $("files");
  const setHl = (name, on) => (F[name] ? F[name].blocks : []).forEach(id =>
    document.querySelectorAll(`.blk[data-id="${id}"]`).forEach(el => el.classList.toggle("hl", on)));
  ["mouseover", "focusin"].forEach(ev => filesEl.addEventListener(ev, e => { const b = e.target.closest("[data-file]"); if (b) setHl(b.dataset.file, true); }));
  ["mouseout", "focusout"].forEach(ev => filesEl.addEventListener(ev, e => { const b = e.target.closest("[data-file]"); if (b) setHl(b.dataset.file, false); }));

  // ---------- Dock layout ----------
  const panelEls = {};
  document.querySelectorAll("#panelPool > [data-panel]").forEach(el => (panelEls[el.dataset.panel] = { el, title: el.dataset.title }));
  const S = (...p) => ({ t: "stack", p, a: 0 });
  const PRESETS = {
    default: { t: "row", s: [0.22, 0.45, 0.33, 0.05], c: [
      S("diagram", "step", "files"), S("stage"), S("code"), { t: "stack", p: ["paper"], a: 0, m: true } ] },
    flow: { t: "row", s: [0.6, 0.2, 0.2], c: [
      S("stage"), { t: "col", s: [0.55, 0.45], c: [S("diagram"), S("step", "files")] }, S("code", "paper") ] },
    code: { t: "row", s: [0.3, 0.45, 0.25], c: [
      { t: "col", s: [0.6, 0.4], c: [S("stage"), S("diagram", "step")] }, S("code"),
      { t: "col", s: [0.6, 0.4], c: [S("paper"), S("files")] } ] },
  };
  const PRESET_NAMES = { default: "Default", flow: "Operation first", code: "Read the code" };
  let dock = null;
  dock = Dock.create($("workspace"), {
    panels: panelEls, presets: PRESETS, storageKey: "arch-layout-v2",
    onResize: id => emit("resize", id),
    onChange: () => { if (dock) buildLayoutMenu(); },  // also fires during create(), before `dock` is set
  });
  setTimeout(buildLayoutMenu);
  // Width-dependent content re-renders when its panel is resized or shown.
  listeners.resize = [id => {
    if (id === "paper") redrawViewers();
    if (id === "diagram") fitDiagramText();
    if (id === "code") $("code").querySelectorAll(".callout").forEach(c => (c.style.maxWidth = Math.min(760, $("code").clientWidth - 90) + "px"));
  }];

  function buildLayoutMenu() {
    const closedP = dock.closedPanels();
    $("layoutMenu").innerHTML = `<h4>Presets</h4>${Object.entries(PRESET_NAMES).map(([k, v]) =>
      `<button type="button" data-preset="${k}">${esc(v)}</button>`).join("")}
      <button type="button" data-preset="default"><span class="sub">Reset to default</span></button>
      ${closedP.length ? `<h4>Reopen</h4>${closedP.map(id => `<button type="button" data-open="${id}">${esc(panelEls[id].title)}</button>`).join("")}` : ""}
      <h4>Tip</h4><p class="sub" style="margin:0 8px 6px">Drag a panel's tab onto another panel to dock it left, right, above, below, or as a tab. Drag the gaps to resize.</p>`;
  }
  $("layoutBtn").addEventListener("click", e => {
    e.stopPropagation();
    const m = $("layoutMenu");
    m.hidden = !m.hidden;
    $("layoutBtn").setAttribute("aria-expanded", String(!m.hidden));
  });
  $("layoutMenu").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.preset) dock.preset(b.dataset.preset);
    if (b.dataset.open) dock.open(b.dataset.open);
    $("layoutMenu").hidden = true;
  });
  document.addEventListener("click", e => { if (!e.target.closest(".menu-wrap")) $("layoutMenu").hidden = true; });

  window.App = {
    DATA, STEPS, B, cfg, preset: PRESET_INFO,
    state: () => ({ cur, sub, sample }),
    goto: i => { setPlaying(false); goto(i); },
    selectSub: (i, keepPlaying) => selectSub(i, keepPlaying),
    setSample: b => setSample(b),
    stageDriver: null,
    jumpToBlock: (key, id) => jumpToBlock(key, id || key),
    stepsFor: key => stepsFor(key),
    on: (ev, fn) => (listeners[ev] = listeners[ev] || []).push(fn),
    dock,
    helpers: { esc, fmt, word },
  };

  // ---------- Initial state ----------
  if (QP.get("layout") && PRESETS[QP.get("layout")]) dock.preset(QP.get("layout"));
  const h = decodeURIComponent(location.hash.slice(1));
  const sMatch = /^s=(\d+)$/.exec(h);
  goto(sMatch ? +sMatch[1] - 1 : 0, false);
  if (h.startsWith("c=") && C[h.slice(2)]) jumpToBlock(h.slice(2), h.slice(2));
  else if (h.startsWith("f=") && F[h.slice(2)]) selectFile(h.slice(2));
})();
</script>
<script src="js/tensors.js"></script>
<script src="js/stage.js"></script>
</body>
</html>
